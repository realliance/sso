- name: Realliance SSO host
  hosts: sso
  become: false
  roles:
    - { role: secrets, tags: [always, secrets] }
    - { role: base, tags: [base] }
    - { role: postgresql, tags: [postgresql] }
    - { role: keycloak, tags: [keycloak] }
    - { role: caddy, tags: [caddy] }
    - { role: pull, tags: [pull] }
