- name: COPR plugin
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Caddy COPR repository
  ansible.builtin.command: dnf -y copr enable @caddy/caddy
  args:
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:group_caddy:caddy.repo

- name: Caddy
  ansible.builtin.dnf:
    name: caddy
    state: present

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Reload caddy

- name: Caddy running
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
