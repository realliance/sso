- name: Check for the host secrets file
  ansible.builtin.stat:
    path: /etc/realliance-sso/secrets.yml
  register: secrets_stat

- name: Refuse to run without host secrets
  ansible.builtin.fail:
    msg: "missing /etc/realliance-sso/secrets.yml — copy it from realliance/sso-secrets/host/secrets.yml"
  when: not secrets_stat.stat.exists

- name: Read host secrets
  ansible.builtin.slurp:
    src: /etc/realliance-sso/secrets.yml
  register: secrets_raw
  no_log: true

- name: Expose host secrets as facts
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ secrets_raw.content | b64decode | from_yaml | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
